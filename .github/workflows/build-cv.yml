name: Build CV

on:
  push:
    paths:
      - "CV.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Generate PDF
        run: pandoc CV.md -o CV.pdf --pdf-engine=wkhtmltopdf

      - name: Commit PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add CV.pdf
          git commit -m "Update CV PDF" || exit 0
          git push

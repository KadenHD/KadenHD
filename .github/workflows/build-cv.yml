name: Build CV

on:
  push:
    paths:
      - "CV.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Generate PDF
        run: pandoc CV.md -o CV.pdf --pdf-engine=wkhtmltopdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: CV
          path: CV.pdf
